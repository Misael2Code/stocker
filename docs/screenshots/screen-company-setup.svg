<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 720" width="380" height="720" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadowComp" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Device Frame -->
  <rect x="10" y="10" width="360" height="700" rx="36" fill="#121212" stroke="#2D3748" stroke-width="3" filter="url(#shadowComp)"/>
  
  <!-- Notch -->
  <ellipse cx="190" cy="24" rx="6" ry="6" fill="#000000"/>

  <!-- App Bar -->
  <rect x="10" y="44" width="360" height="52" fill="#18181B"/>
  <text x="32" y="76" fill="#FFFFFF" font-size="18" font-weight="700">Selecionar Empresa</text>

  <!-- Content: Nova Empresa Modal / Form -->
  <g transform="translate(10, 100)">
    <!-- Header Icon -->
    <circle cx="180" cy="36" r="22" fill="#1E293B"/>
    <!-- Building Icon -->
    <path d="M172 44 v-16 h16 v16 M176 32 h2 M182 32 h2 M176 38 h2 M182 38 h2" stroke="#82B1FF" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <text x="180" y="74" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle">Configuração de Empresa</text>
    <text x="180" y="90" fill="#71717A" font-size="11" text-anchor="middle">Vincule a instância do Senior Sistemas (ERP Sapiens)</text>

    <!-- Section 1: Dados da Empresa -->
    <text x="24" y="124" fill="#93C5FD" font-size="11" font-weight="700">DADOS DA EMPRESA</text>

    <rect x="24" y="134" width="312" height="42" rx="8" fill="#1E1E1E" stroke="#333333" stroke-width="1"/>
    <text x="40" y="160" fill="#71717A" font-size="12">Nome:</text>
    <text x="85" y="160" fill="#FFFFFF" font-size="12" font-weight="600">F1 Consultoria e Tecnologia LTDA</text>

    <rect x="24" y="184" width="312" height="42" rx="8" fill="#1E1E1E" stroke="#333333" stroke-width="1"/>
    <text x="40" y="210" fill="#71717A" font-size="12">CNPJ:</text>
    <text x="85" y="210" fill="#FFFFFF" font-size="12" font-weight="600">48.027.898/0001-18</text>

    <!-- Section 2: Conexao Senior -->
    <text x="24" y="248" fill="#93C5FD" font-size="11" font-weight="700">CONEXÃO COM SERVIDOR SENIOR</text>

    <rect x="24" y="258" width="206" height="42" rx="8" fill="#1E1E1E" stroke="#333333" stroke-width="1"/>
    <text x="40" y="284" fill="#71717A" font-size="12">Servidor:</text>
    <text x="96" y="284" fill="#FFFFFF" font-size="12" font-weight="600">192.168.0.6</text>

    <rect x="238" y="258" width="98" height="42" rx="8" fill="#1E1E1E" stroke="#333333" stroke-width="1"/>
    <text x="250" y="284" fill="#71717A" font-size="12">Porta:</text>
    <text x="290" y="284" fill="#FFFFFF" font-size="12" font-weight="600">8888</text>

    <!-- WebService URL snippet -->
    <rect x="24" y="308" width="312" height="34" rx="6" fill="#141414" stroke="#262626" stroke-width="1"/>
    <text x="34" y="328" fill="#6EE7B7" font-family="monospace" font-size="9">/g5-senior-services/sapiens_Sync...</text>

    <!-- Section 3: Credenciais SOAP -->
    <text x="24" y="364" fill="#93C5FD" font-size="11" font-weight="700">CREDENCIAIS DE WEBSERVICE</text>

    <rect x="24" y="374" width="312" height="42" rx="8" fill="#1E1E1E" stroke="#333333" stroke-width="1"/>
    <text x="40" y="400" fill="#71717A" font-size="12">Usuário:</text>
    <text x="96" y="400" fill="#FFFFFF" font-size="12" font-weight="600">senior</text>

    <rect x="24" y="424" width="312" height="42" rx="8" fill="#1E1E1E" stroke="#333333" stroke-width="1"/>
    <text x="40" y="450" fill="#71717A" font-size="12">Senha:</text>
    <text x="96" y="450" fill="#FFFFFF" font-size="12" font-weight="600">••••••••••</text>

    <!-- Save Button -->
    <rect x="24" y="486" width="312" height="44" rx="10" fill="#2962FF"/>
    <text x="180" y="513" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">Salvar Empresa</text>

    <!-- Multi-tenant Note -->
    <g transform="translate(24, 545)">
      <rect width="312" height="38" rx="8" fill="#1E293B" stroke="#2563EB" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="156" y="23" fill="#93C5FD" font-size="10" text-anchor="middle">🏢 Suporte a Múltiplas Filiais &amp; Servidores</text>
    </g>
  </g>

  <!-- Bottom Home Bar -->
  <rect x="145" y="694" width="90" height="4" rx="2" fill="#52525B"/>
</svg>
