<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 720" width="380" height="720" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="1%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Device Frame -->
  <rect x="10" y="10" width="360" height="700" rx="36" fill="#121212" stroke="#2D3748" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Notch / Camera -->
  <ellipse cx="190" cy="24" rx="6" ry="6" fill="#000000"/>

  <!-- Status Bar -->
  <text x="36" y="32" fill="#E2E8F0" font-size="11" font-weight="600">05:40</text>
  <g transform="translate(305, 23)" fill="#E2E8F0">
    <!-- Signal -->
    <path d="M0 8 h3 v-8 h-3 z M5 8 h3 v-6 h-3 z M10 8 h3 v-4 h-3 z"/>
    <!-- Battery -->
    <rect x="18" y="1" width="16" height="8" rx="2" fill="none" stroke="#E2E8F0" stroke-width="1.2"/>
    <rect x="20" y="3" width="10" height="4" fill="#E2E8F0"/>
  </g>

  <!-- App Bar -->
  <rect x="10" y="44" width="360" height="52" fill="#18181B" border-bottom="1px solid #27272A"/>
  <text x="32" y="76" fill="#FFFFFF" font-size="18" font-weight="700">SaldoJá</text>
  <!-- Admin & Logout Icons -->
  <g transform="translate(285, 60)" stroke="#A1A1AA" stroke-width="2" fill="none">
    <circle cx="10" cy="8" r="6"/>
    <path d="M7 11 L13 11"/>
  </g>
  <g transform="translate(325, 60)" stroke="#A1A1AA" stroke-width="2" fill="none">
    <path d="M4 3 h6 a3 3 0 0 1 3 3 v6 a3 3 0 0 1 -3 3 h-6"/>
    <polyline points="7 10 11 7 7 4"/>
    <line x1="1" y1="7" x2="11" y2="7"/>
  </g>

  <!-- Search Header -->
  <g transform="translate(190, 120)" text-anchor="middle">
    <!-- Search Icon Circle -->
    <circle cx="0" cy="0" r="18" fill="#1E293B"/>
    <path d="M-5 -5 L-1 -1 M-1 -1 A4 4 0 1 0 3 -5 A4 4 0 0 0 -1 -1" stroke="#82B1FF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="0" y="32" fill="#FFFFFF" font-size="17" font-weight="700">Consultar estoque</text>
    <text x="0" y="48" fill="#71717A" font-size="12">Digite o código ou descrição do produto</text>
  </g>

  <!-- Search Input Box -->
  <rect x="32" y="185" width="316" height="44" rx="10" fill="#1E1E1E" stroke="#3F3F46" stroke-width="1"/>
  <text x="48" y="212" fill="#F4F4F5" font-size="14">argila</text>
  <!-- Clear button -->
  <circle cx="326" cy="207" r="8" fill="#27272A"/>
  <text x="323" y="211" fill="#A1A1AA" font-size="12" font-weight="bold">×</text>

  <!-- Search Button -->
  <rect x="32" y="238" width="316" height="42" rx="10" fill="#2962FF"/>
  <text x="190" y="264" fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle">Buscar</text>

  <!-- Section Divider -->
  <line x1="32" y1="300" x2="145" y2="300" stroke="#27272A" stroke-width="1"/>
  <text x="190" y="303" fill="#71717A" font-size="11" font-weight="600" text-anchor="middle">RESULTADOS</text>
  <line x1="235" y1="300" x2="348" y2="300" stroke="#27272A" stroke-width="1"/>

  <!-- Card 1: Argila 1 -->
  <g transform="translate(32, 318)">
    <rect width="316" height="152" rx="14" fill="#1E1E1E" stroke="#27272A" stroke-width="1"/>
    
    <!-- Product Header -->
    <rect x="14" y="12" width="26" height="26" rx="6" fill="#1E293B"/>
    <path d="M21 21 L33 21 M27 17 L27 21" stroke="#82B1FF" stroke-width="1.8" stroke-linecap="round"/>
    <text x="48" y="26" fill="#FFFFFF" font-size="14" font-weight="700">Argila 1</text>
    <text x="48" y="38" fill="#A1A1AA" font-size="11">Código: 1103</text>
    
    <!-- Info Icon -->
    <circle cx="294" cy="22" r="9" fill="none" stroke="#71717A" stroke-width="1.5"/>
    <text x="292" y="26" fill="#71717A" font-size="11" font-weight="bold">i</text>

    <!-- Total Badge -->
    <rect x="14" y="48" width="190" height="24" rx="6" fill="#1E293B"/>
    <text x="22" y="64" fill="#93C5FD" font-size="11" font-weight="700">Total disponível: 52.999,00</text>

    <!-- Location 1 -->
    <rect x="14" y="78" width="288" height="30" rx="6" fill="#141414"/>
    <text x="22" y="97" fill="#E4E4E7" font-size="11">Depósito de Materiais Fil 01</text>
    <text x="290" y="97" fill="#4ADE80" font-size="11" font-weight="700" text-anchor="end">2.999,00</text>

    <!-- Location 2 -->
    <rect x="14" y="112" width="288" height="30" rx="6" fill="#141414"/>
    <text x="22" y="131" fill="#E4E4E7" font-size="11">Depósito Distribuidor</text>
    <text x="290" y="131" fill="#4ADE80" font-size="11" font-weight="700" text-anchor="end">50.000,00</text>
  </g>

  <!-- Card 2: Argila 2 -->
  <g transform="translate(32, 482)">
    <rect width="316" height="152" rx="14" fill="#1E1E1E" stroke="#27272A" stroke-width="1"/>
    
    <!-- Product Header -->
    <rect x="14" y="12" width="26" height="26" rx="6" fill="#1E293B"/>
    <path d="M21 21 L33 21 M27 17 L27 21" stroke="#82B1FF" stroke-width="1.8" stroke-linecap="round"/>
    <text x="48" y="26" fill="#FFFFFF" font-size="14" font-weight="700">Argila 2</text>
    <text x="48" y="38" fill="#A1A1AA" font-size="11">Código: 1104</text>
    
    <!-- Info Icon -->
    <circle cx="294" cy="22" r="9" fill="none" stroke="#71717A" stroke-width="1.5"/>
    <text x="292" y="26" fill="#71717A" font-size="11" font-weight="bold">i</text>

    <!-- Total Badge -->
    <rect x="14" y="48" width="190" height="24" rx="6" fill="#1E293B"/>
    <text x="22" y="64" fill="#93C5FD" font-size="11" font-weight="700">Total disponível: 50.024,00</text>

    <!-- Location 1 -->
    <rect x="14" y="78" width="288" height="30" rx="6" fill="#141414"/>
    <text x="22" y="97" fill="#E4E4E7" font-size="11">Depósito de Materiais Fil 01</text>
    <text x="290" y="97" fill="#4ADE80" font-size="11" font-weight="700" text-anchor="end">24,00</text>

    <!-- Location 2 -->
    <rect x="14" y="112" width="288" height="30" rx="6" fill="#141414"/>
    <text x="22" y="131" fill="#E4E4E7" font-size="11">Depósito Distribuidor</text>
    <text x="290" y="131" fill="#4ADE80" font-size="11" font-weight="700" text-anchor="end">50.000,00</text>
  </g>

  <!-- Bottom Home Bar -->
  <rect x="145" y="694" width="90" height="4" rx="2" fill="#52525B"/>
</svg>
