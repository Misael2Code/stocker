<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="28" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle">Fluxo de Arquitetura &amp; Integração Híbrida</text>

  <!-- Left: Mobile Client (Flutter) -->
  <g transform="translate(30, 60)" filter="url(#boxShadow)">
    <rect width="210" height="220" rx="16" fill="#18181B" stroke="#2563EB" stroke-width="2"/>
    <rect x="0" y="0" width="210" height="36" rx="16" fill="#1E293B"/>
    <text x="105" y="23" fill="#93C5FD" font-size="13" font-weight="700" text-anchor="middle">📱 Stocker Mobile (Flutter)</text>

    <!-- Layers -->
    <rect x="15" y="48" width="180" height="38" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="105" y="68" fill="#F8FAFC" font-size="11" font-weight="600" text-anchor="middle">Camada de Apresentação</text>
    <text x="105" y="80" fill="#94A3B8" font-size="9" text-anchor="middle">Pages, Sheets &amp; Controllers</text>

    <rect x="15" y="94" width="180" height="38" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="105" y="114" fill="#F8FAFC" font-size="11" font-weight="600" text-anchor="middle">Domínio (Clean Arch)</text>
    <text x="105" y="126" fill="#94A3B8" font-size="9" text-anchor="middle">Entities, UseCases, Repositories</text>

    <rect x="15" y="140" width="180" height="60" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="105" y="158" fill="#F8FAFC" font-size="11" font-weight="600" text-anchor="middle">Data Sources &amp; Parser</text>
    <text x="105" y="172" fill="#38BDF8" font-size="9" text-anchor="middle">SOAP XML Client (Stock)</text>
    <text x="105" y="186" fill="#F59E0B" font-size="9" text-anchor="middle">Cloud Firestore (Tenant &amp; User)</text>
  </g>

  <!-- Arrow Top: Mobile -> Firebase -->
  <path d="M 240 120 L 520 120" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow)"/>
  <rect x="330" y="105" width="110" height="24" rx="4" fill="#1E293B"/>
  <text x="385" y="121" fill="#FBBF24" font-size="10" font-weight="600" text-anchor="middle">Autenticação &amp; Filiais</text>

  <!-- Top Right: Firebase -->
  <g transform="translate(530, 60)" filter="url(#boxShadow)">
    <rect width="230" height="100" rx="14" fill="#18181B" stroke="#D97706" stroke-width="2"/>
    <rect x="0" y="0" width="230" height="32" rx="14" fill="#451A03"/>
    <text x="115" y="21" fill="#FCD34D" font-size="12" font-weight="700" text-anchor="middle">🔥 Firebase Platform</text>
    
    <text x="20" y="55" fill="#FFFFFF" font-size="11" font-weight="600">• Firebase Auth (Google Sign-In)</text>
    <text x="20" y="74" fill="#FFFFFF" font-size="11" font-weight="600">• Firestore Database:</text>
    <text x="30" y="90" fill="#94A3B8" font-size="10">collections: 'users' &amp; 'enterprises'</text>
  </g>

  <!-- Arrow Bottom: Mobile -> Senior Sistemas -->
  <path d="M 240 220 L 520 220" stroke="#10B981" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)"/>
  <rect x="315" y="205" width="140" height="24" rx="4" fill="#064E3B"/>
  <text x="385" y="221" fill="#6EE7B7" font-size="10" font-weight="600" text-anchor="middle">SOAP 1.1 / XML (SaldoJá)</text>

  <!-- Bottom Right: Senior Sistemas -->
  <g transform="translate(530, 180)" filter="url(#boxShadow)">
    <rect width="230" height="100" rx="14" fill="#18181B" stroke="#059669" stroke-width="2"/>
    <rect x="0" y="0" width="230" height="32" rx="14" fill="#064E3B"/>
    <text x="115" y="21" fill="#A7F3D0" font-size="12" font-weight="700" text-anchor="middle">🏢 Senior Sistemas (ERP Sapiens)</text>
    
    <text x="20" y="54" fill="#FFFFFF" font-size="11" font-weight="600">• G5 Web Services (HTTP/SOAP)</text>
    <text x="20" y="72" fill="#FFFFFF" font-size="11" font-weight="600">• Serviço: Suprimentos / Estoque</text>
    <text x="30" y="88" fill="#6EE7B7" font-size="9" font-family="monospace">sapiens_Sync...estoque / Saldo</text>
  </g>
</svg>
